appId: com.appycodes.vibetimer
productName: Vibe Timer
directories:
  buildResources: build
  output: release
files:
  - "out/**/*"
  - "package.json"
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: build/icon.png
linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png
